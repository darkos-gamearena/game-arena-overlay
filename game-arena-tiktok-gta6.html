<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Game Arena · GTA 6 overlay (TikTok / PC)</title>
<!--
  GTA VI / Vice City overlay, Game Arena x Hell Energy, in two formats (config "format"):
    tiktok  1080x1920  layout "crop": camera 16:9 at the top (1080x608 from camY), gameplay below it, sides cropped
                       layout "fit" : camera at the top, full 16:9 gameplay under it, sunset zone at the bottom
                       layout "cam" : camera over the whole screen
    pc      1920x1080  layout "pip" : gameplay full screen, camera in a neon window (pc.cam x / y / w, 16:9)
    (Streamlabs/OBS)   layout "game": gameplay only
                       layout "cam" : camera over the whole screen (just chatting)
  Everything is configured by ?c=<base64url JSON> (made by kreator.html). Without it the defaults below are used.
  Camera and gameplay windows are transparent: put the sources under this overlay.
  ?demo=1 draws placeholder camera / gameplay pictures (previews only).
  Inside kreator.html the page also takes live updates from its parent window (postMessage "ga-config")
  and reports where its elements are ("ga-rects") so they can be dragged.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* theme colours (R, G, B), set from the config */
  --g1:43,213,255; --g2:123,60,255; --g3:255,79,163; --g4:255,122,89; --g5:255,196,92;
  --ink:22,6,40; --mid:52,14,84; --low:120,30,110;
  --grad:linear-gradient(90deg,rgb(var(--g1)),rgb(var(--g2)) 28%,rgb(var(--g3)) 55%,rgb(var(--g4)) 80%,rgb(var(--g5)));
  /* layout, set from the config */
  --cam-y:200px; --seam:808px; --zone-b:1920px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;color-scheme:normal}
body{font-family:'Rajdhani',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
/* the canvas is drawn at 1080x1920 (1920x1080 on PC) and scaled to whatever window it gets
   (TikTok LIVE Studio / OBS / Streamlabs may open the link smaller or with Windows DPI scaling) */
.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0}
html.pc .stage{width:1920px;height:1080px}
.layer{position:absolute;pointer-events:none}
.hide{display:none!important}

/* ---------------------------------------------------------------- demo pictures (previews only) */
.demo{display:none;left:0;right:0;overflow:hidden}
body.show-demo .demo{display:block}
.demo--cam{background:radial-gradient(ellipse 60% 70% at 50% 60%,#3a4256,#151922 75%)}
.demo--game{background:linear-gradient(to bottom,#5ec4ff,#ffb37a 55%,#3a5b3f 56%,#1f3323)}
.demo svg{position:absolute;left:50%;bottom:0;width:38%;max-width:420px;transform:translateX(-50%);opacity:.55}
.demo span{position:absolute;right:28px;bottom:22px;font:700 34px/1 'Rajdhani',sans-serif;letter-spacing:.2em;color:rgba(255,255,255,.55)}

/* ---------------------------------------------------------------- opaque sunset zones (outside the windows) */
.zone{left:0;right:0;overflow:hidden;
  background:radial-gradient(ellipse 60% 90% at 50% 100%,rgba(var(--g3),.55),transparent 70%),
             linear-gradient(to bottom,rgb(var(--ink)),rgb(var(--mid)) 55%,rgb(var(--low)))}
.zone--top{top:0;height:var(--cam-y)}
.zone--bottom{top:var(--zone-b);bottom:0;
  background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(var(--g3),.5),transparent 70%),
             linear-gradient(to bottom,rgb(var(--low)),rgb(var(--mid)) 45%,rgb(var(--ink)))}
.zone__grid{position:absolute;left:-30%;right:-30%;top:0;height:200%;transform-origin:50% 0;transform:perspective(500px) rotateX(60deg);
  background-image:linear-gradient(rgba(var(--g3),.35) 2px,transparent 2px),linear-gradient(90deg,rgba(var(--g1),.3) 2px,transparent 2px);
  background-size:90px 90px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 45%);mask-image:linear-gradient(to bottom,#000,transparent 45%)}
/* translucent haze for the camera-only layout */
.haze{left:0;right:0;opacity:.9}
.haze--top{top:0;height:520px;background:linear-gradient(to bottom,rgba(var(--g2),.5),rgba(var(--g3),.14) 48%,transparent)}
.haze--bottom{bottom:0;height:640px;background:linear-gradient(to top,rgba(var(--g4),.4),rgba(var(--g3),.18) 40%,transparent)}

/* retro striped sun */
.sun{position:absolute;left:50%;width:360px;height:360px;margin-left:-180px;border-radius:50%;will-change:transform;
  background:linear-gradient(to bottom,rgb(var(--g5)),rgb(var(--g4)) 45%,rgb(var(--g3)) 75%,rgb(var(--g2)));
  -webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent 40% 43%,#000 43% 51%,transparent 51% 55%,#000 55% 62%,transparent 62% 67%,#000 67%);
          mask-image:linear-gradient(to bottom,#000 40%,transparent 40% 43%,#000 43% 51%,transparent 51% 55%,#000 55% 62%,transparent 62% 67%,#000 67%);
  animation:sun-float 9s ease-in-out infinite}
.zone--top .sun{bottom:-200px;opacity:.85}
.zone--bottom .sun{top:-150px;width:460px;height:460px;margin-left:-230px;opacity:.6;transform:scaleY(-1);animation:none}
.sun--cam{bottom:-380px;width:640px;height:640px;margin-left:-320px;opacity:.3}
@keyframes sun-float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-14px,0)}}

/* palms (SVG drawn by script), swaying from the trunk base */
.palm{will-change:transform;animation:sway 6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(var(--g3),.5))}
.palm.flip svg{transform:scaleX(-1)}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(2deg)}}

/* light flare every 9 s */
.flare{left:0;top:-200px;width:240px;height:2400px;opacity:0;will-change:transform,opacity;
  background:linear-gradient(90deg,transparent,rgba(255,235,240,.16),rgba(var(--g3),.08) 60%,transparent);
  animation:flare 9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes flare{0%{transform:translate3d(-500px,0,0) rotate(18deg);opacity:0}3%{opacity:1}
  20%{transform:translate3d(1400px,0,0) rotate(18deg);opacity:1}21%,100%{transform:translate3d(1400px,0,0) rotate(18deg);opacity:0}}

/* dark fade at the bottom so TikTok comments stay readable */
.fade{left:0;right:0;bottom:0;height:520px;background:linear-gradient(to top,rgba(var(--ink),.55),transparent)}

/* window edges and the seam */
.edge-line{left:0;right:0;height:4px;background:var(--grad);box-shadow:0 0 16px rgba(var(--g3),.8)}
.seam{left:0;right:0;top:calc(var(--seam) - 4px);height:8px;overflow:hidden;background:var(--grad);
  box-shadow:0 0 22px rgba(var(--g3),.9),0 0 50px rgba(var(--g2),.6)}
.seam::after{content:"";position:absolute;top:0;bottom:0;left:0;width:260px;will-change:transform;
  background:linear-gradient(90deg,transparent,#fff,transparent);animation:seam-run 3.5s ease-in-out infinite alternate}
@keyframes seam-run{from{transform:translate3d(-260px,0,0)}to{transform:translate3d(1080px,0,0)}}

/* neon frame + comet */
.frame{left:0;top:0;width:1080px;height:1920px;overflow:visible}
.frame .edge{fill:none;stroke:url(#grad);stroke-width:5;filter:url(#glow)}
.frame .comet{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;filter:url(#glow);animation:comet 7s linear infinite}
@keyframes comet{to{stroke-dashoffset:calc(var(--perimeter) * -1)}}

/* PC: neon window around the camera, with a sun peeking over it */
.camframe{border:5px solid transparent;border-image:var(--grad) 1;box-shadow:0 0 22px rgba(var(--g3),.75),inset 0 0 18px rgba(var(--g2),.35)}
.camdeco{overflow:hidden}
.camdeco .sun{top:0;opacity:.9;animation:none}

/* ---------------------------------------------------------------- Game Arena x Hell Energy plate */
.plate-pos{left:540px;top:228px;transform-origin:50% 0;z-index:7}
.plate-wrap{position:relative;filter:drop-shadow(0 0 14px rgba(var(--g3),.55)) drop-shadow(0 6px 14px rgba(0,0,0,.5));animation:drop-in 1s cubic-bezier(.2,.9,.2,1) both}
.plate-wrap::before{content:"";position:absolute;inset:-3px;background:var(--grad);clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px)}
.plate{position:relative;display:flex;align-items:center;gap:18px;height:84px;padding:0 22px 0 26px;overflow:hidden;
  background:linear-gradient(120deg,rgba(var(--ink),.82),rgba(var(--ink),.64));
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px)}
@keyframes drop-in{from{opacity:0;transform:translate3d(0,-40px,0) scale(.92)}to{opacity:1;transform:none}}
.plate .ga{width:112px;height:66px;background:url("assets/game-arena-logo.png") center/contain no-repeat}
.plate .x{font:700 40px/1 'Rajdhani',sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.plate .hell{display:flex;align-items:center;height:60px;padding:0 16px;background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 0 16px rgba(255,40,40,.45)}
.plate .hell img{display:block;height:44px}
.plate::after{content:"";position:absolute;top:0;bottom:0;left:0;width:110px;will-change:transform;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%{transform:translate3d(-150px,0,0)}35%,100%{transform:translate3d(560px,0,0)}}
.plate.solo .x,.plate.solo .hell{display:none}

/* ---------------------------------------------------------------- wanted stars + messages pill */
.pill-pos{left:540px;top:808px;transform-origin:50% 50%;z-index:6}
.pill-wrap{position:relative;filter:drop-shadow(0 0 12px rgba(var(--g2),.7)) drop-shadow(0 6px 12px rgba(0,0,0,.5));animation:pop-in .9s .25s cubic-bezier(.2,.9,.2,1) both}
@keyframes pop-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.pill-wrap::before{content:"";position:absolute;inset:-3px;background:var(--grad);clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.pill{position:relative;display:flex;align-items:center;gap:18px;width:880px;height:66px;padding:0 26px;
  background:rgba(var(--ink),.9);clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.stars{display:flex;gap:4px;flex:none}
.star{width:32px;height:32px;opacity:.28;will-change:transform,opacity;animation:wanted 12s linear infinite}
.star:nth-child(2){animation-delay:.25s}.star:nth-child(3){animation-delay:.5s}.star:nth-child(4){animation-delay:.75s}.star:nth-child(5){animation-delay:1s}
.star path{fill:#fff;stroke:rgba(0,0,0,.7);stroke-width:2}
@keyframes wanted{0%,1%{opacity:.28;transform:scale(1)}3%{opacity:1;transform:scale(1.45)}5%,30%{opacity:1;transform:scale(1)}
  32%{opacity:.3}34%{opacity:1}36%{opacity:.3}38%{opacity:1}40%{opacity:.3}42%{opacity:1}52%,100%{opacity:.28;transform:scale(1)}}
.msgs{position:relative;flex:1;height:100%;overflow:hidden}
.msg{position:absolute;left:0;right:0;top:0;height:66px;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translate3d(0,44px,0);transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .45s ease}
.msg__text{display:inline-block;white-space:pre;font:700 34px/1 'Rajdhani',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.msg b{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.msg.is-on{opacity:1;transform:none}
.msg.is-off{opacity:0;transform:translate3d(0,-44px,0)}

/* ---------------------------------------------------------------- name tag (TikTok handle on the camera) */
.tag-pos{left:40px;top:720px;transform-origin:0 0;z-index:6}
.tag-wrap{position:relative;filter:drop-shadow(0 0 10px rgba(var(--g3),.6));animation:pop-in .9s .4s cubic-bezier(.2,.9,.2,1) both}
.tag-wrap::before{content:"";position:absolute;inset:-2px;background:var(--grad);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.tag{position:relative;display:flex;align-items:center;gap:12px;height:54px;padding:0 22px 0 16px;background:rgba(var(--ink),.88);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.tag i{width:12px;height:12px;border-radius:50%;background:rgb(var(--g3));box-shadow:0 0 10px rgb(var(--g3));animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
.tag span{font:700 32px/1 'Rajdhani',sans-serif;letter-spacing:.04em;color:#fff;white-space:pre;padding-top:3px}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="layer demo demo--game" id="demo-game"><span>GAMEPLAY</span></div>
  <div class="layer demo demo--cam" id="demo-cam"><svg viewBox="0 0 200 160"><circle cx="100" cy="52" r="34" fill="#9aa4b8"/><path d="M20 160c0-46 36-74 80-74s80 28 80 74z" fill="#9aa4b8"/></svg><span>KAMERA</span></div>

  <div class="layer haze haze--top" id="haze-top"></div>
  <div class="layer haze haze--bottom" id="haze-bottom"></div>
  <div class="layer zone zone--top" id="zone-top"><div class="sun" id="sun-top"></div></div>
  <div class="layer zone zone--bottom" id="zone-bottom"><div class="zone__grid"></div><div class="sun" id="sun-bottom"></div></div>
  <div class="layer sun sun--cam" id="sun-cam"></div>
  <div class="layer fade" id="fade"></div>
  <div id="palms"></div>
  <div class="layer flare" id="flare"></div>

  <div class="layer edge-line" id="edge-cam"></div>
  <div class="layer edge-line" id="edge-game"></div>
  <div class="layer seam" id="seam"></div>
  <div class="layer camdeco" id="camdeco"><div class="sun" id="sun-pip"></div></div>
  <div class="layer camframe" id="camframe"></div>

  <svg class="layer frame" id="frame" viewBox="0 0 1080 1920">
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" id="gs1"/><stop offset=".3" id="gs2"/><stop offset=".6" id="gs3"/><stop offset="1" id="gs4"/>
      </linearGradient>
      <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <polygon class="edge" id="edge"/>
    <polygon class="comet" id="comet"/>
  </svg>

  <div class="layer plate-pos" id="plate-pos">
    <div class="plate-wrap"><div class="plate" id="plate">
      <div class="ga" role="img" aria-label="Game Arena"></div>
      <span class="x">×</span>
      <div class="hell"><img src="assets/hell-energy-logo.png" alt="Hell Energy"></div>
    </div></div>
  </div>

  <div class="layer pill-pos" id="pill-pos">
    <div class="pill-wrap"><div class="pill" id="pill">
      <div class="stars" id="stars"></div>
      <div class="msgs" id="msgs"></div>
    </div></div>
  </div>

  <div class="layer tag-pos" id="tag-pos">
    <div class="tag-wrap"><div class="tag" id="tag"><i></i><span id="tag-text"></span></div></div>
  </div>
</main>

<script>
(function () {
  'use strict';

  /* ================================================================ defaults (kreator.html has the same list) */
  var DEFAULTS = {
    format: 'tiktok',        // tiktok (1080x1920) | pc (1920x1080, Streamlabs / OBS)
    layout: 'crop',          // TikTok: crop | fit | cam
    camY: 200,               // TikTok: top of the camera window
    pc: { layout: 'pip', cam: { x: 1440, y: 792, w: 440 } },  // PC: pip | game | cam, camera window (16:9)
    theme: 'vice',           // vice | hell | arena
    plate: { on: true, hell: true, x: null, y: null, scale: 1 },               // null = automatic position
    pill: { on: true, stars: true, x: null, y: null, scale: 1, interval: 4 },
    msgs: ['*GTA VI* uživo iz Game Arene', 'Game Arena *Doboj* • Svetog Save 57A', 'Pun gas uz *Hell Energy*', 'Zaprati za još *GTA 6* akcije'],
    tag: { on: false, text: '@tvoj.nalog', x: null, y: null, scale: 1 },
    fx: { sun: true, palms: true, frame: true, flare: true, seam: true, fade: true }
  };
  var THEMES = {
    vice:  { g: ['43,213,255', '123,60,255', '255,79,163', '255,122,89', '255,196,92'], ink: '22,6,40', mid: '52,14,84', low: '120,30,110' },
    hell:  { g: ['120,0,16', '200,0,24', '255,31,46', '255,106,0', '255,196,0'], ink: '14,4,4', mid: '44,6,8', low: '118,14,20' },
    arena: { g: ['0,225,255', '0,150,255', '42,107,255', '123,60,255', '230,231,232'], ink: '6,10,20', mid: '10,24,48', low: '22,44,96' }
  };
  var CAM_H = 608;

  function merge(base, over) {
    var out = Array.isArray(base) ? base.slice() : {};
    if (!Array.isArray(base)) for (var k in base) out[k] = base[k];
    if (over && typeof over === 'object' && !Array.isArray(base)) {
      for (var key in over) {
        if (!(key in base)) continue;
        var b = base[key], v = over[key];
        if (b && typeof b === 'object' && !Array.isArray(b)) out[key] = merge(b, v);
        else if (Array.isArray(b)) out[key] = Array.isArray(v) ? v.map(String).slice(0, 12) : b;
        else if (v === null || typeof v === typeof b || b === null) out[key] = v;
      }
    }
    return out;
  }
  function decode(str) {
    try {
      var b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    } catch (e) { return null; }
  }
  var params = new URLSearchParams(location.search);
  if (params.get('demo') === '1') document.body.classList.add('show-demo');
  var config = merge(DEFAULTS, params.get('c') ? decode(params.get('c')) : null);

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, +v || 0)); };
  var show = function (id, on) { $(id).classList.toggle('hide', !on); };

  /* ================================================================ static pieces built once */
  // neon frame with a comet running around it (rebuilt when the canvas size changes)
  function buildFrame(W, H) {
    var IN = 12, C = 46;
    var pts = [[IN + C, IN], [W - IN, IN], [W - IN, H - IN - C], [W - IN - C, H - IN], [IN, H - IN], [IN, IN + C]];
    var per = 0;
    pts.forEach(function (a, i) { var b = pts[(i + 1) % pts.length]; per += Math.hypot(b[0] - a[0], b[1] - a[1]); });
    var attr = pts.map(function (q) { return q.join(','); }).join(' ');
    var svg = $('frame');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.style.width = W + 'px';
    svg.style.height = H + 'px';
    $('edge').setAttribute('points', attr);
    $('comet').setAttribute('points', attr);
    $('comet').style.strokeDasharray = '220 ' + Math.round(per - 220);
    $('comet').style.setProperty('--perimeter', Math.round(per));
  }

  var STAR = '<svg class="star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.1.8-5.3 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1-5.3-4.9 7.1-.8z"/></svg>';
  $('stars').innerHTML = STAR + STAR + STAR + STAR + STAR;

  function palmSVG(seed) {
    var s = seed;
    var rnd = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
    var cr = [182, 128];
    var trunk = 'M138,550 Q150,330 ' + (cr[0] - 8) + ',' + (cr[1] + 6) + ' L' + (cr[0] + 8) + ',' + (cr[1] + 10) + ' Q170,340 172,550 Z';
    var fronds = [-172, -145, -118, -88, -58, -30, -6, 16].map(function (deg) {
      var a = deg * Math.PI / 180, L = 150 + rnd() * 50;
      var tip = [cr[0] + Math.cos(a) * L, cr[1] + Math.sin(a) * L + 0.42 * L * Math.abs(Math.cos(a)) + 20];
      var mid = [(cr[0] + tip[0]) / 2, (cr[1] + tip[1]) / 2 - 34];
      var nx = -(tip[1] - cr[1]) / L, ny = (tip[0] - cr[0]) / L, w = 26;
      return '<path d="M' + cr + ' Q' + (mid[0] + nx * w) + ',' + (mid[1] + ny * w) + ' ' + tip[0].toFixed(1) + ',' + tip[1].toFixed(1) +
        ' Q' + (mid[0] - nx * w * 0.35) + ',' + (mid[1] - ny * w * 0.35) + ' ' + cr + 'Z"/>';
    }).join('');
    return '<svg viewBox="0 0 330 550" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">' +
      '<defs><linearGradient id="pg' + seed + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:rgb(var(--mid))"/><stop offset="1" style="stop-color:rgb(var(--ink))"/></linearGradient></defs>' +
      '<g fill="url(#pg' + seed + ')"><path d="' + trunk + '"/>' + fronds + '<circle cx="' + cr[0] + '" cy="' + (cr[1] + 4) + '" r="12"/></g></svg>';
  }
  // each palm: [side, distance from that side, y of the trunk base, width, height, seed, animation delay]
  function placePalms(c, L) {
    var box = $('palms');
    box.innerHTML = '';
    if (!c.fx.palms) return;
    var list = [];
    if (L.layout === 'cam') {
      var k0 = L.pc ? 0.8 : 1;
      list = [['l', -70, L.H + 10, 330 * k0, 550 * k0, 11, 0], ['r', -80, L.H + 10, 330 * k0, 550 * k0, 29, -2.2], ['r', 120, L.H + 10, 220 * k0, 380 * k0, 47, -4]];
    } else if (L.pc) {
      if (L.layout === 'pip') {
        var k = L.cam.w / 440, pw = 120 * k, ph = 190 * k;
        list = [['l', L.cam.x - pw * 0.55, L.cam.y + 8, pw, ph, 11, 0], ['r', L.W - L.cam.x - L.cam.w - pw * 0.55, L.cam.y + 8, pw, ph, 29, -2.2]];
      }
    } else {
      list = [['l', -22, L.camY + 10, 150, 236, 11, 0], ['r', -26, L.camY, 150, 236, 29, -2.2]];
      if (L.layout === 'fit') list.push(['l', -60, 1930, 300, 500, 47, -1], ['r', -70, 1930, 300, 500, 61, -3.4]);
    }
    list.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'layer palm' + (p[0] === 'r' ? ' flip' : '');
      el.style.cssText = (p[0] === 'l' ? 'left:' : 'right:') + Math.round(p[1]) + 'px;top:' + Math.round(p[2] - p[4]) + 'px;width:' + Math.round(p[3]) + 'px;height:' + Math.round(p[4]) + 'px;' +
        'transform-origin:' + (p[0] === 'l' ? '45%' : '55%') + ' 100%;animation-delay:' + p[6] + 's';
      if (L.layout === 'cam') el.style.opacity = '.85';
      el.innerHTML = palmSVG(p[5]);
      box.appendChild(el);
    });
  }

  /* ================================================================ messages */
  var timer = null, items = [], current = 0;
  function buildMessages(c) {
    var box = $('msgs');
    box.textContent = '';
    clearInterval(timer);
    items = c.msgs.filter(function (m) { return String(m).trim(); }).map(function (m) {
      var el = document.createElement('div');
      el.className = 'msg';
      var line = document.createElement('span'); // one inline run: spaces next to the <b> survive the flex box
      line.className = 'msg__text';
      String(m).trim().split(/(\*[^*]+\*)/).forEach(function (part) {
        if (!part) return;
        if (part.charAt(0) === '*' && part.length > 2) {
          var b = document.createElement('b');
          b.textContent = part.slice(1, -1);
          line.appendChild(b);
        } else line.appendChild(document.createTextNode(part));
      });
      el.appendChild(line);
      box.appendChild(el);
      return el;
    });
    current = 0;
    if (!items.length) return;
    items[0].classList.add('is-on');
    if (items.length > 1) {
      timer = setInterval(function () {
        var prev = items[current];
        current = (current + 1) % items.length;
        var next = items[current];
        prev.classList.remove('is-on');
        prev.classList.add('is-off');
        next.classList.remove('is-off');
        void next.offsetWidth;
        next.classList.add('is-on');
        setTimeout(function () { prev.classList.remove('is-off'); }, 600);
      }, clamp(c.pill.interval, 2, 20) * 1000);
    }
    fitMessages();
  }
  function fitMessages() {
    var w = $('msgs').clientWidth - 8;
    items.forEach(function (el) {
      var line = el.firstChild;
      line.style.fontSize = '';
      var over = line.offsetWidth / w;
      if (over > 1) line.style.fontSize = (34 / over).toFixed(1) + 'px';
    });
  }

  /* ================================================================ render the whole config */
  var nn = function (v, auto) { return v === null || v === undefined || v === '' ? auto : +v; };

  // resolves every automatic position for the current format / layout
  function layoutOf(c) {
    if (c.format === 'pc') {
      var W = 1920, H = 1080, layout = ['pip', 'game', 'cam'].indexOf(c.pc.layout) >= 0 ? c.pc.layout : 'pip';
      var w = Math.round(clamp(c.pc.cam.w, 240, 1200)), h = Math.round(w * 9 / 16);
      var cam = { x: Math.round(clamp(c.pc.cam.x, 0, W - w)), y: Math.round(clamp(c.pc.cam.y, 0, H - h)), w: w, h: h };
      var pip = layout === 'pip';
      return {
        pc: true, W: W, H: H, layout: layout, cam: cam,
        plate: { x: nn(c.plate.x, W / 2), y: nn(c.plate.y, 24) },
        pill: { x: nn(c.pill.x, W / 2), y: nn(c.pill.y, H - 50) },
        tag: { x: nn(c.tag.x, pip ? cam.x : 40), y: nn(c.tag.y, pip ? cam.y - 66 : H - 170) }
      };
    }
    var tlay = ['crop', 'fit', 'cam'].indexOf(c.layout) >= 0 ? c.layout : 'crop';
    var full = tlay === 'cam';
    var camY = full ? 0 : clamp(c.camY, 0, 1920 - CAM_H - 200);
    var seam = camY + CAM_H;
    var gameH = tlay === 'fit' ? CAM_H : 1920 - seam;
    return {
      pc: false, W: 1080, H: 1920, layout: tlay, camY: camY, seam: seam, gameH: gameH,
      cam: full ? { x: 0, y: 0, w: 1080, h: 1920 } : { x: 0, y: camY, w: 1080, h: CAM_H },
      game: full ? null : { x: 0, y: seam, w: 1080, h: gameH },
      plate: { x: nn(c.plate.x, 540), y: nn(c.plate.y, full ? 236 : camY + 28) },
      pill: { x: nn(c.pill.x, 540), y: nn(c.pill.y, full ? 384 : seam) },
      tag: { x: nn(c.tag.x, 40), y: nn(c.tag.y, full ? 1240 : seam - 92) }
    };
  }
  var fitScale = 1;
  function fit() {
    var pc = root.classList.contains('pc'), W = pc ? 1920 : 1080, H = pc ? 1080 : 1920;
    var vw = window.innerWidth, vh = window.innerHeight;
    if (!vw || !vh) return;
    var s = Math.min(vw / W, vh / H);
    if (Math.abs(s - 1) < 0.002) s = 1;
    fitScale = s;
    var dx = Math.round((vw - W * s) / 2), dy = Math.round((vh - H * s) / 2);
    $('stage').style.transform = s === 1 && !dx && !dy ? '' : 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  var place = function (el, r) { el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; el.style.height = r.h + 'px'; };
  var lastSize = '';

  function render(c) {
    config = c;
    var L = layoutOf(c);
    var t = THEMES[c.theme] || THEMES.vice;
    t.g.forEach(function (v, i) { root.style.setProperty('--g' + (i + 1), v); });
    root.style.setProperty('--ink', t.ink);
    root.style.setProperty('--mid', t.mid);
    root.style.setProperty('--low', t.low);
    ['gs1', 'gs2', 'gs3', 'gs4'].forEach(function (id, i) { $(id).setAttribute('stop-color', 'rgb(' + t.g[i] + ')'); });

    root.classList.toggle('pc', L.pc);
    if (lastSize !== L.W + 'x' + L.H) { buildFrame(L.W, L.H); lastSize = L.W + 'x' + L.H; }
    fit();
    var full = L.layout === 'cam';
    var tiktokSplit = !L.pc && !full;
    var pip = L.pc && L.layout === 'pip';

    // demo pictures under the transparent windows
    var dc = $('demo-cam'), dg = $('demo-game');
    if (L.pc) {
      place(dg, { x: 0, y: 0, w: L.W, h: L.H });
      dg.classList.toggle('hide', full);
      place(dc, full ? { x: 0, y: 0, w: L.W, h: L.H } : L.cam);
      dc.classList.toggle('hide', L.layout === 'game');
    } else {
      place(dc, L.cam);
      dc.classList.remove('hide');
      if (L.game) place(dg, L.game);
      dg.classList.toggle('hide', !L.game);
    }

    if (!L.pc) {
      root.style.setProperty('--cam-y', L.camY + 'px');
      root.style.setProperty('--seam', L.seam + 'px');
      root.style.setProperty('--zone-b', (L.seam + L.gameH) + 'px');
    }
    show('zone-top', tiktokSplit);
    show('zone-bottom', !L.pc && L.layout === 'fit');
    show('haze-top', full);
    show('haze-bottom', full);
    $('haze-top').style.height = L.pc ? '300px' : '';
    $('haze-bottom').style.height = L.pc ? '360px' : '';
    show('sun-top', c.fx.sun);
    show('sun-bottom', c.fx.sun);
    show('sun-cam', full && c.fx.sun);
    show('fade', c.fx.fade && (L.pc ? !full : L.layout === 'crop'));
    $('fade').style.height = L.pc ? '260px' : '';
    show('flare', c.fx.flare);
    show('frame', c.fx.frame);
    show('seam', tiktokSplit && c.fx.seam);
    show('edge-cam', tiktokSplit);
    show('edge-game', !L.pc && L.layout === 'fit');
    if (!L.pc) {
      $('edge-cam').style.top = (L.camY - 2) + 'px';
      $('edge-game').style.top = (L.seam + L.gameH - 2) + 'px';
    }

    // PC camera window + the sun peeking over it
    show('camframe', pip);
    show('camdeco', pip && c.fx.sun);
    if (pip) {
      place($('camframe'), { x: L.cam.x - 5, y: L.cam.y - 5, w: L.cam.w + 10, h: L.cam.h + 10 });
      var sz = Math.round(L.cam.w * 0.42), vis = Math.round(sz * 0.32);
      place($('camdeco'), { x: Math.round(L.cam.x + (L.cam.w - sz) / 2), y: L.cam.y - 5 - vis, w: sz, h: vis });
      var sun = $('sun-pip');
      sun.style.width = sz + 'px'; sun.style.height = sz + 'px'; sun.style.marginLeft = (-sz / 2) + 'px';
    }
    placePalms(c, L);

    show('plate-pos', c.plate.on);
    $('plate').classList.toggle('solo', !c.plate.hell);
    $('plate-pos').style.left = clamp(L.plate.x, 0, L.W) + 'px';
    $('plate-pos').style.top = clamp(L.plate.y, 0, L.H - 20) + 'px';
    $('plate-pos').style.transform = 'translateX(-50%) scale(' + clamp(c.plate.scale, 0.4, 2) + ')';

    show('pill-pos', c.pill.on);
    show('stars', c.pill.stars);
    $('pill-pos').style.left = clamp(L.pill.x, 0, L.W) + 'px';
    $('pill-pos').style.top = clamp(L.pill.y, 0, L.H) + 'px';
    $('pill-pos').style.transform = 'translate(-50%,-50%) scale(' + clamp(c.pill.scale, 0.4, 2) + ')';

    show('tag-pos', c.tag.on && String(c.tag.text).trim() !== '');
    $('tag-text').textContent = String(c.tag.text).slice(0, 40);
    $('tag-pos').style.left = clamp(L.tag.x, 0, L.W - 40) + 'px';
    $('tag-pos').style.top = clamp(L.tag.y, 0, L.H - 40) + 'px';
    $('tag-pos').style.transform = 'scale(' + clamp(c.tag.scale, 0.4, 2.5) + ')';

    buildMessages(c);
    reportRects();
  }

  /* ================================================================ talk to kreator.html (only when framed) */
  var framed = window.parent && window.parent !== window;
  function rectOf(id) {
    var el = $(id);
    if (el.classList.contains('hide')) return null;
    var r = el.getBoundingClientRect(), s = fitScale, o = $('stage').getBoundingClientRect();
    return { x: Math.round((r.left - o.left) / s), y: Math.round((r.top - o.top) / s), w: Math.round(r.width / s), h: Math.round(r.height / s) };
  }
  function reportRects() {
    if (!framed) return;
    // measure after the entry animations have settled
    setTimeout(function () {
      window.parent.postMessage({
        type: 'ga-rects',
        rects: { plate: rectOf('plate'), pill: rectOf('pill'), tag: rectOf('tag') },
        layout: layoutOf(config)
      }, '*');
    }, 60);
  }
  if (framed) {
    window.addEventListener('message', function (e) {
      if (e.source !== window.parent || !e.data) return;
      if (e.data.type === 'ga-hello') { window.parent.postMessage({ type: 'ga-ready', defaults: DEFAULTS }, '*'); return; }
      if (e.data.type !== 'ga-config') return;
      document.body.classList.toggle('show-demo', !!e.data.demo);
      render(merge(DEFAULTS, e.data.config));
    });
    window.parent.postMessage({ type: 'ga-ready', defaults: DEFAULTS }, '*');
  }

  render(config);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitMessages(); reportRects(); });
  window.addEventListener('load', reportRects);
  setTimeout(reportRects, 1300); // after the entry animations
})();
</script>
</body>
</html>
